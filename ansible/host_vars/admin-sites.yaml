---
userdetails:
  - name: ewfadm
    group: chlservices
    gid: 600
    home: /home/ewfadm
  - name: xmladm
    group: chlservices
    gid: 600
    home: /home/xmladm
  - name: xmloutadm
    group: chlservices
    gid: 600
    home: /home/xmloutadm
  - name: chdadm
    group: chlservices
    gid: 600
    home: /home/chdadm

selinux_status:
  - policy: targeted
    state: permissive

s3_file_perl_lib: /application/shared/libraries/perl-xerces-lib.tar.gz
s3_file_perl_lib_name: '{{ s3_file_perl_lib | basename }}'

tar_files:
  - "{{ s3_file_perl_lib_name }}"

install_watcher_service: true

postfix_main_config_file: main.cf
postfix_config:
  - key: mydomain
    value: companieshouse.gov.uk
  - key: myorigin
    value: $mydomain
  - key: relayhost
    value: smtp-outbound.sharedservices.aws.internal

postfix_net_config:
  - key: inet_interfaces
    value: all
  - key: inet_protocols
    value: ipv4

## clamav_ng Variables
clamav_ng_freshclam_privatemirror: clamav-mirror.sharedservices.aws.internal
